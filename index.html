<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9b2f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Burg">
<title>The Burg</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --barn:#9b2f1f; --barn-d:#6f1f14; --wheat:#e9c46a; --wheat-d:#c99a3b;
  --cream:#fbf6ea; --paper:#fffdf7; --soil:#3d2b1f; --muted:#6b5b4e;
  --sage:#4a7340; --sky:#7fb3d5; --line:#e7dcc4;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--soil);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Title screen */
.title{padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);text-align:center}
.scene{width:100%;max-width:420px;margin:0 auto;display:block}
.title h1{font-size:46px;letter-spacing:1px;color:var(--barn);margin-top:6px}
.title .sub{color:var(--muted);margin:4px 0 20px}
.field{display:block;text-align:left;margin:14px 0 6px;font-weight:600;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input[type=text]{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--paper)}
input[type=text]:focus{outline:none;border-color:var(--wheat-d)}
.lengths{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.len{padding:14px 6px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.len b{display:block;font-size:17px}.len span{font-size:12px;color:var(--muted)}
.len.on{border-color:var(--barn);background:#fbe9e4}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:17px;margin-top:12px}
.btn.primary{background:var(--barn);color:#fff;box-shadow:0 3px 0 var(--barn-d)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--barn-d)}
.btn.ghost{border:2px solid var(--line);background:var(--paper)}
.btn[disabled]{opacity:.45;pointer-events:none}
.best{margin-top:18px;font-size:14px;color:var(--muted)}

/* Game header */
.top{background:var(--barn);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 12px;position:sticky;top:0;z-index:5}
.top .row{display:flex;justify-content:space-between;align-items:baseline}
.top h2{font-size:20px}
.top .money{font-weight:800;font-size:20px}
.top .meta{font-size:13px;opacity:.85;margin-top:2px;display:flex;justify-content:space-between}
.progress{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--wheat)}
main{flex:1;padding:14px 14px calc(var(--safe-b) + 200px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stat label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between}
.bar{height:10px;background:#efe6d2;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn{text-align:left;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:74px}
.fbtn .ic{font-size:22px}.fbtn b{display:block;font-size:14px;margin-top:2px}.fbtn small{color:var(--muted);font-size:12px;line-height:1.25;display:block}
.fbtn.on{border-color:var(--barn);background:#fbe9e4}
.fbtn[disabled]{opacity:.4}
.endbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 66px);width:min(492px,calc(100% - 28px));z-index:6;display:flex;gap:8px}
.endbar .btn{margin-top:0;padding:10px 6px;font-size:16px;min-height:56px}.endbar #end{flex:2.2;line-height:1.15}.endbar #end small{display:block;font-size:12.5px;font-weight:600;opacity:.9;margin-top:2px}
.endbar .ghost{flex:1;font-size:14px;padding:10px 2px}
.weekstrip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 130px);width:min(492px,calc(100% - 28px));z-index:6;
  display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:7px 10px;box-shadow:0 2px 10px rgba(61,43,31,.12);text-align:left}
.weekstrip .wl{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}.weekstrip .wc{flex:1;display:flex;flex-wrap:wrap;gap:2px}
.weekstrip .delta{margin:0;font-size:12.5px;padding:2px 6px}.weekstrip .more{font-size:22px;color:var(--muted);line-height:1}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fgrid .fbtn{min-height:64px;text-align:center;padding:8px 4px}.fgrid .fbtn b{font-size:13.5px}
.fdesc{font-size:14px;margin-top:10px;line-height:1.35}.fdesc .s{font-size:13px;color:var(--barn-d);margin-top:4px}
.statbtn{text-align:left;padding:4px 2px;border-radius:10px;width:100%}.statbtn:active{background:#f3ead6}.statbtn label{cursor:pointer}
.info{font-size:11px;color:var(--muted)}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.sumchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13.5px;min-height:40px}
.tip{display:flex;gap:10px;align-items:center;background:#eef5e9;border-color:#cfe2c3;font-size:14px}
.warn .sm{margin-left:6px;margin-top:6px}
.sm.locked{background:#fff;color:var(--muted);border:1.5px dashed #cdbfa5}.lockedrow .t{color:var(--muted)}
.job > div:last-child .s{white-space:nowrap}.upt{color:#3d6b33;font-weight:700}.downt{color:var(--barn);font-weight:700}.chip.ok.on{background:var(--sage);border-color:var(--sage)}
.warn{background:#fbe9e4;border-color:#efc2b8;color:var(--barn-d);font-size:14px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.chip.on{background:var(--soil);color:#fff;border-color:var(--soil)}
.job{display:flex;justify-content:space-between;gap:10px;align-items:center}
.job .t{font-weight:700}.job .s{font-size:13px;color:var(--muted)}
.job .pay{font-weight:800;color:var(--sage);white-space:nowrap}
.sm{padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--barn);color:#fff;white-space:nowrap}
.sm.alt{background:#fff;border:1.5px solid var(--line);color:var(--soil)}
.sm[disabled]{background:#d8cfbf;color:#fff;pointer-events:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:#efe6d2;color:var(--muted);margin-left:4px;vertical-align:middle}
.tag.cur{background:var(--sage);color:#fff}
.logitem{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.logitem em{font-style:normal;color:var(--muted);font-size:12px;display:block}
.muted{color:var(--muted);font-size:14px}

/* Tabs */
#app > nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:7}
#app > nav .in{display:flex;width:100%;max-width:520px}
#app > nav button{flex:1;padding:8px 0 10px;font-size:12px;color:var(--muted);font-weight:600}
#app > nav button .ic{display:block;font-size:20px}
#app > nav button.on{color:var(--barn)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(var(--safe-b) + 20px);max-height:88vh;overflow:auto;animation:up .25s}
.sheet h2{font-size:23px;color:var(--barn);margin-bottom:6px}
.sheet .big{font-size:44px;text-align:center}
.sheet p{margin:8px 0}
.delta{display:inline-block;margin:3px 4px 0 0;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:700}
.delta.up{background:#e3f0dc;color:#3d6b33}.delta.flat{background:#efe6d2;color:var(--muted)}.delta.down{background:#f7dfda;color:#9b2f1f}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 196px);transform:translateX(-50%);background:var(--soil);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.maptog{display:flex;gap:6px;margin:2px 0 10px}.maptog button{flex:1;border:1.5px solid var(--barn);background:#fff;color:var(--barn);border-radius:999px;padding:7px 10px;font-size:14px;font-weight:700}
.maptog button.on{background:var(--barn);color:#fff}
.maptabs{display:flex;gap:6px;margin-bottom:6px}.maptabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.maptabs button.on{border-color:var(--soil);color:var(--soil);background:#f6efdf}
.mapsvg{display:block;width:100%;height:auto;border-radius:12px;border:1.5px solid var(--line);touch-action:manipulation}
.mapsvg .mlbl{font-size:9px;fill:#6b5a49;font-style:italic}.mapsvg .mwlbl text{font-size:9px;fill:#3f7491;font-style:italic}
.mapsvg .mtown{font-size:9.5px;font-weight:800;fill:#3d2b1f;paint-order:stroke;stroke:#fffaf0;stroke-width:3px;pointer-events:none}
.mpin{cursor:pointer;outline:none}.mpin:focus-visible circle{stroke:var(--barn);stroke-width:3}
.mapcap{font-size:13px;color:var(--muted);margin:6px 2px 8px}.mapdet{margin:4px 0 0;background:#fffaf0}
.slots{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px;text-align:left}
.slot{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.slot.empty{border-style:dashed}.slot.empty .slotinfo{opacity:.7}.slot .s{font-size:12.5px;color:var(--muted)}.slotinfo{min-width:0}
.slotbtns{display:flex;gap:6px;flex-shrink:0}
.hdr-r{display:flex;align-items:center}
#helpbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.85);color:#fff;font-size:19px;font-weight:800;line-height:1;margin-left:10px;flex-shrink:0}
.helpview{position:fixed;inset:0;background:var(--cream);z-index:25;overflow:auto;-webkit-overflow-scrolling:touch}
.helphead{position:sticky;top:0;background:var(--barn);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 12px) 16px 12px;z-index:2}
.helphead h1{font-size:22px}
.helpbody{max-width:520px;margin:0 auto;padding:14px 14px calc(var(--safe-b) + 30px)}
.tutcard{background:#eef5e9;border-color:#cfe2c3}.tutcard p{margin:6px 0 0;font-size:15px}
.guide h2{font-size:20px;color:var(--barn);margin:24px 0 8px}.guide .gt{margin-top:8px}
.guide section{scroll-margin-top:70px}.guide p{margin:8px 0;line-height:1.45}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toc button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;min-height:44px}
.guide table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;background:var(--paper);border-radius:10px;overflow:hidden}
.guide th,.guide td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.guide th{font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px}
.guide tr.grp td{background:#f6efdf}.guide ul{padding-left:20px}.guide li{margin:6px 0;line-height:1.4}
.totop{font-size:13px;color:var(--muted);padding:8px 0;min-height:36px}
#coach{position:fixed;inset:0;z-index:45;pointer-events:none}
.cdim{position:fixed;background:rgba(30,18,10,.62);pointer-events:auto;touch-action:none}
.cring{position:fixed;border:3px solid #ffd166;border-radius:14px;pointer-events:none}
.cring.tap{animation:cpulse 1.2s infinite}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.85)}100%{box-shadow:0 0 0 18px rgba(255,209,102,0)}}
.cfinger{position:fixed;font-size:30px;pointer-events:none;animation:ctap 1.2s infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@keyframes ctap{0%,100%{transform:translate(-20%,20%)}50%{transform:translate(-20%,0) scale(.88)}}
.cbubble{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));background:var(--paper);border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:auto;font-size:15px}
.cstep{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.ctext{margin:6px 0 12px;line-height:1.4}.cbtns{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chint{font-size:13.5px;color:var(--barn);font-weight:700}
@media (prefers-reduced-motion: reduce){.cring.tap,.cfinger{animation:none}}
.sm,.chip,.maptog button,.maptabs button,.sumchip,.totop,.weekstrip,.statbtn,.toc button{min-height:44px}
.sm{min-width:44px}.slotbtns .sm{min-width:48px}
.triph{margin:12px 0 4px;font-size:15px}
.stopbtn{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;min-height:48px}
.stopbtn .t{display:block;font-weight:700;font-size:15px}.stopbtn .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.stopbtn.on{border-color:var(--barn);background:#fbe9e4}.stopbtn:disabled{opacity:.6}
.tripsum{font-weight:700;margin:10px 0 0}
.sumchip.on{border-color:var(--barn);background:#fbe9e4}
.tripto{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px dashed var(--line);min-height:52px;font:inherit;color:inherit;cursor:pointer}.tripto > span:first-child{display:flex;flex-direction:column}
#helpbtn{width:44px;height:44px}
:focus-visible{outline:3px solid #1f5fae;outline-offset:2px}
.top :focus-visible,.helphead :focus-visible{outline-color:#fff}
#app > nav button:focus-visible{outline-offset:-4px}
.mpin:focus-visible{outline:none}.mpin:focus-visible circle:nth-of-type(2){stroke:#1f5fae;stroke-width:4}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (orientation: landscape) and (max-height: 520px){
  .top{padding:calc(var(--safe-t) + 4px) 16px 4px}.top h2{font-size:16px}.top .money{font-size:17px}
  .top .meta{font-size:12px;margin-top:0}.top .progress{margin-top:3px}
  #app > nav button{padding:2px 0;font-size:11.5px;min-height:44px}#app > nav button .ic{display:inline;font-size:16px;margin-right:4px}
  .endbar{left:auto;right:14px;transform:none;width:calc(58% - 21px);bottom:calc(var(--safe-b) + 50px)}
  .endbar .btn{min-height:50px;padding:4px}
  .weekstrip{left:14px;transform:none;width:calc(42% - 21px);bottom:calc(var(--safe-b) + 50px);min-height:50px}
  main{padding-bottom:calc(var(--safe-b) + 116px)}
  .toast{bottom:calc(var(--safe-b) + 112px)}
}
.evplace{text-align:center;color:var(--muted);font-size:14px;margin:0 0 6px}
.recent{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}.recent .s{margin-top:4px}
.evbadge.fresh circle{animation:evpulse 1.6s ease-in-out 3}
@keyframes evpulse{50%{stroke-width:5;stroke:#ffd166}}
@media (prefers-reduced-motion: reduce){.evbadge.fresh circle{animation:none}}
.code{width:100%;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--soil);word-break:break-all;resize:vertical}
.warnline{color:var(--barn-d);font-weight:600}
.score{font-size:64px;font-weight:800;text-align:center;color:var(--barn);font-family:Georgia,serif}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<div id="helpview" class="helpview hidden" role="dialog" aria-label="Help"></div>

<script>
/* ============================================================
   THE BURG — a life sim in Waitsburg, WA
   ============================================================ */
const APP_VERSION = '0.1.0';
const SAVE_KEY = 'theburg.save.v2', BEST_KEY = 'theburg.best.v2';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const $ = s => document.querySelector(s);
const fmt = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const clamp = (v,a=0,b=100) => Math.max(a, Math.min(b, v));
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SEASON = m => ['Winter','Winter','Spring','Spring','Spring','Summer','Summer','Summer','Fall','Fall','Fall','Winter'][m];
const GAS = 3.89, WORKDAYS = 21, ERRAND_MILES = 300;

const W = 12/52;                 // months in one week (all money constants below are monthly)
const SS_PAY = 1900;
const COL_RATE = 0.03, WAGE_RATE = 0.025;          // yearly growth of prices and of pay
const cost = v => v * (S ? S.col : 1);              // today's price of something listed in 2027 dollars
const payNow = (j, withRaise = true) => j.pay * (S ? S.wage : 1) * (withRaise && S && S.jobId === j.id ? S.raise : 1);
const ssPay = () => cost(SS_PAY);
// layoff risk by job: 1 = shaky (retail, seasonal), 0.2 = steady (public sector, licensed work)
const LAYOFF_RISK = { diner:1, hardware:1, lift:1, cellar:1, onion:1, retail:1, foodplant:1, airport:1,
  elevator:.5, cna:.5, mech:.5, imaging:.5, loan:.5, hanford:.5, labadmin:.5, trucker:.5, rail:.5,
  para:.2, insure:.2, clerk:.2, co:.2, rn:.2, prof:.2, scientist:.2, farmhand:0 };
const K401 = [0, 0.05, 0.10];
const RUT_WEEKS = 8;
// how much a focus still does after repeating it: full for 4 weeks, then fading to 30%
function focusEffect(f = S.focus, n = S.streakF === f ? S.streakN : 1){ return f === 'study' || n <= 4 ? 1 : Math.max(0.3, 1 - 0.12 * (n - 4)); }
const wk = v => fmt(v*W) + '/wk';
const LENGTHS = {
  half: { label:'6 Months', sub:'26 weeks',  turns:26,       target:16000 },
  two:  { label:'2 Years',  sub:'104 weeks', turns:104,      target:90000 },
  five: { label:'5 Years',  sub:'260 weeks', turns:260,      target:300000 },
  life: { label:'Lifetime', sub:'18 to the end', turns:Infinity, target:3000000 }
};

const CITIES = {
  waitsburg: { name:'Waitsburg',   miles:0,  blurb:'Home. Main Street, the Touchet River, and everybody knows your truck.' },
  dayton:    { name:'Dayton',      miles:11, blurb:'Up Highway 12 past the wheat. Courthouse, the old depot, Bluewood up the hill.' },
  wallawalla:{ name:'Walla Walla', miles:21, blurb:'The big town next door: wineries, sweet onions, colleges and the hospital.' },

// A backup is every saved life plus best scores. It leaves as a .json file or a "backup code" (text you can paste
// into a message to yourself); codes are gzip-compressed when the browser can.
function backupData(){ return { app: 'theburg', kind: 'backup', v: 1, version: APP_VERSION, exported: new Date().toISOString(), slots: slots(), best: store.get(BEST_KEY) || {} }; }
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = text => Uint8Array.from(atob(text.replace(/\s+/g, '')), c => c.charCodeAt(0));
async function backupCode(obj){
  const json = JSON.stringify(obj);
  if (window.CompressionStream) {
    const gz = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    return 'BURG1:' + b64(new Uint8Array(await new Response(gz).arrayBuffer()));
  }
  return 'BURG0:' + b64(new TextEncoder().encode(json));
}
async function readBackup(text){
  text = (text || '').trim();
  let d;
  try {
    if (text.startsWith('{')) d = JSON.parse(text);
    else if (text.startsWith('BURG1:')) {
      if (!window.DecompressionStream) throw new Error('This browser can\'t open compressed codes. Use the backup file instead.');
      const raw = new Blob([unb64(text.slice(6))]).stream().pipeThrough(new DecompressionStream('gzip'));
      d = JSON.parse(await new Response(raw).text());
    } else if (text.startsWith('BURG0:')) d = JSON.parse(new TextDecoder().decode(unb64(text.slice(6))));
    else throw new Error('');
  } catch (e) { throw new Error(e.message || 'That doesn\'t look like a backup from The Burg.'); }
  if (!d || d.app !== 'theburg' || !Array.isArray(d.slots)) throw new Error('That doesn\'t look like a backup from The Burg.');
  const ok = g => g && typeof g === 'object' && typeof g.name === 'string' && LENGTHS[g.len] && Number.isFinite(g.money) && Number.isFinite(g.date) && Number.isFinite(g.ageMonths);
  const lives = d.slots.slice(0, SLOT_COUNT).map(g => ok(g) ? migrate(g) : null);
  if (!lives.some(Boolean)) throw new Error('That backup has no saved lives in it.');
  return { lives, best: d.best && typeof d.best === 'object' ? d.best : {}, exported: d.exported };
}
// put a backup's lives in: 'add' fills empty slots (returns how many didn't fit), 'replace' swaps all slots
function restoreBackup(b, mode){
  const cur = slots(), best = store.get(BEST_KEY) || {};
  for (const [k, v] of Object.entries(b.best)) if (LENGTHS[k] && Number.isFinite(v) && !(best[k] >= v)) best[k] = v;
  store.set(BEST_KEY, best);
  let skipped = 0;
  if (mode === 'replace') store.set(SLOTS_KEY, b.lives.map((g, i) => g ? { ...g, slot: i } : null).concat(Array(SLOT_COUNT).fill(null)).slice(0, SLOT_COUNT));
  else {
    for (const g of b.lives.filter(Boolean)) { const i = cur.indexOf(null); if (i < 0) { skipped++; continue; } cur[i] = { ...g, slot: i }; }
    store.set(SLOTS_KEY, cur);
  }
  return skipped;
}

      const btn = cur ? '<span class="tag cur">Yours</span>' : k==='beater' ? '' : `<button class="sm" data-car="${k}" ${S.loanLeft>0?'disabled':''}>${label}</button>`;
      return `<div class="kv job"><div><div class="t">${c.name}</div><div class="s">${c.mpg} mpg${c.pay?` · ${wk(cur && S.loanPay ? S.loanPay : cost(c.pay))} for 5 years`:''}</div></div>${btn}</div>`;
    }).join('')}
    <p class="muted">Trade-in value of your ride: ${fmt(S.carValue)}${S.loanLeft>0?` · ${Math.ceil(S.loanLeft/W)} weekly payments left`:''}</p>
    <p class="muted">🔧 ${S.turn - (S.svc ?? 0) <= 26 ? 'Oil changed recently: fewer breakdowns.' : S.turn - (S.svc ?? 0) <= 52 ? `Last oil change ${S.turn - (S.svc ?? 0)} weeks ago.` : 'Overdue for an oil change: breakdowns are more likely.'} ${S.tires === S.car ? '❄️ Winter tires on.' : ''} Get car care on a trip to Dayton, Walla Walla or the Tri-Cities.</p>
  </div>
  <div class="card"><h3>🏦 Retirement savings (401(k))</h3>
    <div class="kv"><span>Balance</span><span><b>${fmt(S.k401)}</b></span></div>
    ${S.retired ? `<p class="muted">You're retired: about ${wk(S.k401*0.04/12)} comes out each week.</p>` : `
    <p class="muted" style="margin:6px 0">Put part of each paycheck away before taxes. At 5% or more your employer adds 3%. It grows about 6% a year and pays out when you retire.</p>
    <div class="maptog">${K401.map((r,i) => `<button class="${S.k401rate===i?'on':''}" data-k401="${i}">${r*100}%</button>`).join('')}</div>`}
  </div>
  <div class="card"><h3>❤️ Household</h3>
    <div class="kv"><span>Partner</span><span>${S.partner ? 'Together 💕' : 'Single'}</span></div>
    <div class="kv"><span>Dog</span><span>${S.dog ? 'One good dog 🐕' : 'None'}</span></div>
    <div class="kv"><span>Kids</span><span>${S.kids.length ? S.kids.map(b => Math.floor((S.ageMonths-b)/12)).map(a => a < 18 ? `age ${a}` : 'grown').join(', ') : 'None'}</span></div>
    <div class="kv"><span>Prices since 2027</span><span>${S.col > 1.005 ? `+${Math.round((S.col-1)*100)}%` : 'Same'}</span></div>
    <div class="kv"><span>Town council</span><span>${S.council ? 'Council member' : '—'}</span></div>
  </div>`;
  document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => moveHome(b.dataset.home));
  document.querySelectorAll('[data-car]').forEach(b => b.onclick = () => buyCar(b.dataset.car));
  document.querySelectorAll('[data-k401]').forEach(b => b.onclick = () => { S.k401rate = +b.dataset.k401; save(); renderLife(); toast(`Saving ${K401[S.k401rate]*100}% of each paycheck`); });
}

function moveHome(k){
  const x = HOMES[k], old = HOMES[S.home];
  const sale = old.own ? Math.round(S.equity * 0.94) : 0;
  const need = (x.own ? cost(x.down) : 0) + cost(300);
  if (S.money + sale < need) return toast(`You need ${fmt(need - sale)} on hand (down payment + moving).`);
  sheet(`<h2>${x.own ? 'Buy' : 'Move to'} ${x.name}?</h2>
    <p>${x.own ? `Down payment ${fmt(cost(x.down))}, then ${wk(cost(x.cost))} mortgage (locked in).` : `Rent is ${wk(cost(x.cost))}.`} Moving costs ${fmt(cost(300))}.</p>
    ${old.own ? `<p>You'll sell your current place and pocket ${fmt(sale)}.</p>` : ''}
    <button class="btn primary" id="y">Do it</button><button class="btn ghost" id="n">Cancel</button>`);
  $('#y').onclick = () => {
    S.money += sale - need; S.equity = x.own ? cost(x.down) : 0; S.mortgage = x.own ? cost(x.cost) : null; S.home = k;
    adj({happy:4}); log(`Moved into the ${x.name.toLowerCase()}.`);
    closeSheet(); save(); render();
  };
  $('#n').onclick = closeSheet;
}
function buyCar(k){
  const c = CARS[k], price = cost(k==='sedan' ? c.price : c.down) - Math.round(S.carValue);
  if (S.money < price) return toast(`You need ${fmt(price)} after your trade-in.`);
  sheet(`<h2>Get the ${c.name.toLowerCase()}?</h2>
    <p>Your ${CARS[S.car].name.toLowerCase()} trades in for ${fmt(S.carValue)}. You pay ${fmt(Math.max(0,price))} now${c.pay?`, then ${wk(cost(c.pay))} for 5 years`:''}.</p>
    <button class="btn primary" id="y">Buy it</button><button class="btn ghost" id="n">Cancel</button>`);
  $('#y').onclick = () => {
    S.money -= price; S.car = k; S.carValue = cost(c.value); S.loanLeft = c.months || 0; S.loanPay = c.pay ? cost(c.pay) : 0; S.svc = S.turn;
    adj({happy:5}); log(`Drove home a ${c.name.toLowerCase()}.`);
    closeSheet(); save(); render();
  };
  $('#n').onclick = closeSheet;
}

/* ---------- modal ---------- */
let lastFocus = null;
function sheet(html){
  const wasOpen = !$('#modal').classList.contains('hidden');
  if (!wasOpen) lastFocus = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  const sh = $('#sheet'); sh.innerHTML = html; $('#modal').classList.remove('hidden'); sh.scrollTop = 0;
  const h = sh.querySelector('h2'); sh.setAttribute('aria-label', h ? h.textContent : 'Message');
  const first = sh.querySelector('[data-i], button.primary, button');
  if (first && !(typeof TUT !== 'undefined' && TUT)) setTimeout(() => first.focus({ preventScroll: true }), 30);   // the tutorial places focus itself
}
function closeSheet(){
  const wasOpen = !$('#modal').classList.contains('hidden');
  $('#modal').classList.add('hidden');
  if (wasOpen) setTimeout(() => { const el = lastFocus && document.getElementById(lastFocus); if (el && !TUT) el.focus({ preventScroll: true }); }, 30);
}
const focusables = root => [...root.querySelectorAll('button:not([disabled]), [tabindex="0"], input, a[href]')].filter(e => e.offsetParent !== null || e.closest('svg'));
// say something to screen readers without showing it
function announce(msg){ const r = $('#sr'); if (!r) return; r.textContent = ''; setTimeout(() => { r.textContent = msg; }, 60); }
document.addEventListener('keydown', e => {
  const modalOpen = !$('#modal').classList.contains('hidden'), helpOpen = !$('#helpview').classList.contains('hidden');
  const coach = document.querySelector('#coach:not(.hidden)');
  const root = coach ? null : modalOpen ? $('#sheet') : helpOpen ? $('#helpview') : null;
  if (e.key === 'Escape') {
    if (coach) { e.preventDefault(); return endTutorial(false); }
    if (modalOpen) { const b = ['#no', '#close', '#back', '#ok'].map(q => $('#sheet ' + q)).find(Boolean); if (b) { e.preventDefault(); b.click(); } return; }
    if (helpOpen) { e.preventDefault(); return closeHelp(); }
  }
  if (e.key === 'Tab' && root) {                               // keep Tab inside the open sheet or help page
    const f = focusables(root); if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
  }
});

/* ---------- turn processing (one turn = one week) ---------- */
function endTurn(){ playWeeks(1); }

// Plays up to n weeks. Skips (n > 1) stop when something needs the player: an event with a real choice,
// a milestone note, a year in review, or the end of the game.
function playWeeks(n){
  S.run = { weeks: 0, money: S.money, happy: S.happy, health: S.health, community: S.community, happened: [] };
  let res;
  for (let i = 0; i < n; i++) {
    res = weekTick(n > 1); S.run.weeks++;
    if (res.ending || res.ev || res.notes.length || res.review) break;
  }
  save();
  const after = () => {
    if (res.ending) return finish(res.ending);
    render();
    if (res.ev) showEvent(res.ev);
    else if (res.review) showReview(res.review);
    const r = S.run, dm = S.money - r.money, ch = (n, v) => Math.abs(v) < 0.5 ? `${n} unchanged` : `${n} ${v > 0 ? 'up' : 'down'} ${Math.abs(Math.round(v))}`;
    announce(`${r.weeks > 1 ? r.weeks + ' weeks' : 'Week'} done. Cash ${dm >= 0 ? 'up' : 'down'} ${fmt(Math.abs(dm))}, now ${fmt(S.money)}. ${ch('Happiness', S.happy - r.happy)}, ${ch('health', S.health - r.health)}, ${ch('community', S.community - r.community)}. ${dateLabel()}.`);
  };
  if (res.notes.length) {
    sheet(`<h2>${S.run.weeks > 1 ? S.run.weeks + ' weeks later' : 'This week'}</h2>
      ${res.notes.map(t => `<p><b>${t}</b></p>`).join('')}
      <p>${runChips()}</p>
      <button class="btn primary" id="ok">Continue</button>`);
    $('#ok').onclick = () => { closeSheet(); after(); };
  } else after();
}
// what the last End Week / skip did, counting events resolved since
function runChips(){
  if (!S.run) return '';
  const r = S.run, dm = S.money - r.money;
  const d = [['😊', S.happy - r.happy], ['❤️', S.health - r.health], ['🤝', S.community - r.community]];
  return `<span class="delta ${dm>=0?'up':'down'}">${dm>=0?'+':''}${fmt(dm)}</span>` +
    d.map(([ic,v]) => `<span class="delta ${Math.abs(v) < 0.5 ? 'flat' : v>0?'up':'down'}">${ic} ${Math.abs(v) < 0.5 ? '±0' : (v>0?'▲':'▼') + Math.abs(Math.round(v))}</span>`).join('');
}
function showRunDetails(){
  const r = S.run; if (!r) return;
  const dm = S.money - r.money;
  sheet(`<h2>${r.weeks > 1 ? `The last ${r.weeks} weeks` : 'This week'}</h2>
    <p>${runChips()}</p>
    ${S.last ? `<h3 style="margin-top:12px">${r.weeks > 1 ? 'The last week' : 'Money'}</h3>${S.last.lines.map(([l,v]) => `<div class="kv"><span>${l}</span><span style="color:${v<0?'var(--barn)':'var(--sage)'}">${v>0?'+':''}${fmt(v)}</span></div>`).join('')}
      <div class="kv"><span><b>Paychecks and bills</b></span><span><b>${S.last.net>=0?'+':''}${fmt(S.last.net)}</b></span></div>` : ''}
    ${r.happened.length ? `<h3 style="margin-top:12px">What happened</h3>${r.happened.map(h => `<div class="kv"><span>${h.ic} ${esc(h.title)}</span><span style="color:${h.money<0?'var(--barn)':'var(--sage)'}">${h.money ? (h.money>0?'+':'') + fmt(h.money) : ''}</span></div>`).join('')}` : ''}
    <div class="kv"><span><b>Total change in cash</b></span><span><b>${dm>=0?'+':''}${fmt(dm)}</b></span></div>
    <button class="btn primary" id="ok">Close</button>`);
  $('#ok').onclick = closeSheet;
}
function showReview(rv){
  const row = (l, a, b, money) => { const d = b - a; return `<div class="kv"><span>${l}</span><span>${money ? fmt(b) : Math.round(b)} <span class="delta ${Math.abs(d) < (money?1:0.5) ? 'flat' : d>0?'up':'down'}">${Math.abs(d) < (money?1:0.5) ? '±0' : (d>0?'▲':'▼') + (money ? fmt(Math.abs(d)) : Math.round(Math.abs(d)))}</span></span></div>`; };
  sheet(`<div class="big">📅</div><h2 style="text-align:center">${rv.year} in review</h2>
    <p class="muted" style="text-align:center">${esc(S.name)} is ${age()} now.</p>
    ${row('Net worth', rv.start.nw, rv.end.nw, true)}${row('Happiness', rv.start.happy, rv.end.happy)}${row('Health', rv.start.health, rv.end.health)}${row('Community', rv.start.community, rv.end.community)}
    ${rv.milestones.length ? `<h3 style="margin-top:12px">Milestones</h3>${rv.milestones.map(m => `<div class="logitem">${esc(m)}</div>`).join('')}` : '<p class="muted">A quiet year.</p>'}
    <p class="muted">${rv.events} event${rv.events===1?'':'s'} this year.</p>
    <button class="btn primary" id="ok">On to ${rv.year + 1}</button>`);
  $('#ok').onclick = () => { closeSheet(); render(); };
}

function weekTick(auto){
  const L = LENGTHS[S.len], m = W, k = 0.28;
  const f = FOCUS[S.focus] || FOCUS.rest, j = S.retired ? null : job();
  const lines = [], notes = [];

  // ---- money (constants are monthly; m converts to one week) ----
  let gross = 0;
  if (S.retired) {
    gross = ssPay()*m; lines.push(['Social Security', gross]);
    if (S.k401 > 0) { const w = Math.min(S.k401, S.k401 * 0.04 * m / 12); S.k401 -= w; gross += w; lines.push(['401(k) withdrawal', w]); }
  }
  else if (j) { gross = payNow(j) * m * (f.payMult||1); lines.push([`Paycheck${f.payMult?' + overtime':''}`, gross]); }
  let k401 = 0;
  if (j && !S.retired && S.k401rate) {           // pre-tax contribution, with a 3% employer match at 5% or more
    k401 = gross * K401[S.k401rate]; lines.push(['401(k) contribution', -k401]);
    S.k401 += k401 + gross * 0.03;
  }
  if (gross) lines.push(['Taxes', -(gross - k401) * (S.retired ? 0.05 : 0.15)]);
  if (!S.retired && !j && S.ui > 0) { const n = Math.min(m, S.ui); lines.push(['Unemployment benefits', 1100*S.wage*n]); S.ui -= n; }
  if (f.hustle) lines.push(['Side hustle', cost(ri(350, 850)) * m]);
  const home = HOMES[S.home], car = CARS[S.car];
  lines.push([home.own ? 'Mortgage' : 'Rent', -(home.own && S.mortgage ? S.mortgage : cost(home.cost))*m]);
  const trip = tripWeek(lines);                    // this week's trip around the region, if one is planned
  const stocked = S.turn < S.stockUntil;
  lines.push([stocked ? 'Food & utilities (stocked up)' : 'Food & utilities', -cost(520 - (stocked ? GROCERY_SHARE * STOCK_OFF : 0))*m]);
  lines.push(['Insurance & phone', -cost(160)*m]);
  { const y = new Date(S.date).getFullYear(); if (curMonth() === 0 && S.tabsYear !== y) { lines.push(['Vehicle tabs (DMV)', -cost(95)]); S.tabsYear = y; } }
  const miles = (commuteOneWay()*2*WORKDAYS + ERRAND_MILES) * m;
  lines.push([commuteOneWay() ? 'Gas (commute + errands)' : 'Gas (errands)', -miles*cost(GAS)/car.mpg]);
  if (S.loanLeft > 0) {
    const n = Math.min(m, S.loanLeft); lines.push(['Truck payment', -(S.loanPay || CARS.truck.pay)*n]); S.loanLeft -= n;
    if (S.loanLeft < 1e-6) { S.loanLeft = 0; notes.push('🛻 The truck is paid off!'); log('Made the last truck payment.'); }
  }
  if (S.dog) lines.push(['Dog food & vet', -cost(45)*m]);
  if (S.partner) { lines.push(['Date nights', -cost(120)*m]); if (age() < 65) lines.push(["Partner's paycheck (part-time)", 1400*S.wage*m]); }
  const kidsHome = kidsAtHome();
  if (kidsHome) lines.push([kidsHome > 1 ? `Kids (${kidsHome})` : 'Kid', -cost(650)*kidsHome*m]);
  const a0 = age();
  if (a0 >= 50) lines.push(['Health care', -cost(a0 >= 65 ? 420 : 180)*m]);
  if (f.cost) lines.push([f.name, -cost(f.cost)*m]);
  if (f.study && S.edu < 3) {
    lines.push(['Tuition', -cost(TUITION[S.edu])*m]);
    S.studyProg += 1;
    if (S.studyProg >= STUDY_NEED[S.edu]) { S.studyProg = 0; S.edu++; notes.push(`🎓 You earned your ${EDU[S.edu]}! New jobs unlocked.`); log(`Graduated with a ${EDU[S.edu]}.`); adj({happy:8}); }
  }
  if (S.money < 0) lines.push(['Interest on debt', S.money * 0.015 * m]);
  const net = lines.reduce((a,[,v]) => a + v, 0);
  S.money += net;
  S.last = { lines: lines.filter(([,v]) => Math.round(v)), net };
  if (home.own) S.equity = S.equity * Math.pow(1.025, 1/52) + home.equityPer * m;   // principal paid + 2.5%/yr appreciation
  S.carValue = Math.max(500, S.carValue * Math.pow(0.99, m));
  S.k401 *= Math.pow(1.06, 1/52);
  S.col *= Math.pow(1 + COL_RATE, 1/52); S.wage *= Math.pow(1 + WAGE_RATE, 1/52);

  // ---- stats drift for the week ----
  const a = age();
  let dh = -0.5 + (52 - S.happy) * 0.06;
  let dH = ((a < 30 ? 85 : a < 50 ? 78 : a < 65 ? 68 : a < 80 ? 55 : 42) - S.health) * 0.025;
  let dc = (25 - S.community) * 0.05;
  if (S.retired) dh += 1;
  else if (j) { dh -= j.stress; dH -= j.wear; dc += j.city==='waitsburg' ? 0.6 : j.city==='dayton' ? 0.2 : 0; }
  else dh -= 2;
  dh -= commuteOneWay() / 40;
  dh += home.happy * 0.4 + (S.partner ? 0.6 : 0) + (S.dog ? 0.4 : 0) + kidsHome * 0.3 - (S.money < 0 ? 2 : 0);
  dc += kidsHome * 0.2;
  if (S.council) dc += 0.8;
  // worn down: pushing through low health with overtime or side hustles makes it worse, fast
  if (S.health < 35 && (S.focus === 'work' || S.focus === 'hustle')) dH -= 2.5;
    S.happy = clamp(S.happy + dh*m); S.health = clamp(S.health + dH*m); S.community = clamp(S.community + dc*m);
  // doing the same thing week after week loses its punch (classes excepted), and a long rut wears on you
  if (S.streakF === S.focus) S.streakN++; else { S.streakF = S.focus; S.streakN = 1; }
  const eff = focusEffect();
  adj(Object.fromEntries(Object.entries(f.fx).map(([st,v]) => {
    let d = v * k * (v > 0 ? eff * (trip && trip.away ? TRIP_TIME : 1) : 1);
    if (S.focus === 'rest' && v > 0) d *= clamp((86 - S[st]) / 20, 0, 1);   // rest tops out in the low 80s
    return [st, d];
  })));
  if (S.focus !== 'study' && S.streakN > RUT_WEEKS) {
    adj({happy: -1.2});
    if (S.streakN === RUT_WEEKS + 1) notes.push(`🔁 ${S.streakN - 1} weeks of "${f.name}" in a row. You're in a rut: try a different focus.`);
  }
  if (trip) adj(trip.fx);

  // ---- maybe an event this week ----
  let ev = !S.noEvents && chance(0.28) ? pickEvent(curMonth()) : null;
  if (ev) {
    S.evCd[ev.title] = S.turn + (ev.yr ? 40 : 8);
    { const pl = eventPlace(ev); S.evPins = [{ t: ev.title, ic: ev.ic, m: pl[0], k: pl[1], turn: S.turn + 1, r: '' }, ...(S.evPins || [])].slice(0, 12); }
    if (ev.once) S.evDone[ev.title] = 1;
    S.evLabel = dateLabel();
    S.yearEvents = (S.yearEvents || 0) + 1;
    if (auto) {                      // while skipping ahead, one-choice events resolve on their own
      const ch = ev.choices().filter(c => !c.if || c.if());
      if (ch.length === 1) {
        const m0 = S.money, r = ch[0].go();
        if (r) log(`${ev.title}: ${r}`);
        if (S.run) S.run.happened.push({ ic: ev.ic, title: ev.title, money: S.money - m0 });
        if (S.evPins && S.evPins[0] && S.evPins[0].t === ev.title) S.evPins[0].r = r || '';
        ev = null;
      }
    }
  }

  // ---- advance one week ----
  S.happySum += S.happy * m; S.healthSum += S.health * m; S.monthsPlayed += m;
  const oldAge = age(), oldYear = new Date(S.date).getFullYear();
  S.date += 7 * 864e5; S.ageMonths += m; S.turn++; S.jobMonths += m; S.applied = false;
  if (age() > oldAge && age() % 10 === 0) notes.push(`🎂 Happy ${age()}th birthday!`);
  if (S.focus === 'work' && !job()) S.focus = 'rest';
  let review = null;
  const newYear = new Date(S.date).getFullYear();
  if (newYear > oldYear) {
    const snap = { nw: netWorth(), happy: S.happy, health: S.health, community: S.community };
    if (S.yearStart && LENGTHS[S.len].turns > 26) review = { year: oldYear, start: S.yearStart, end: snap, events: S.yearEvents || 0,
      milestones: S.log.filter(e => e.d.endsWith(String(oldYear)) && !e.m.includes(': ')).map(e => e.m).reverse().slice(0, 8) };
    S.yearStart = snap; S.yearEvents = 0;
  }

  // ---- health crises & endings ----
  let ending = null;
  if (S.health <= 0) {
    if (L.turns === Infinity && age() >= 50) ending = `${S.name}'s health finally gave out at age ${age()}.`;
    else { const bill = Math.round(cost(6500)); S.money -= bill; S.health = 30; adj({happy:-10}); notes.push(`🏥 You ended up in the hospital. The bill was ${fmt(bill)}.`); log('Spent a week in the hospital in Walla Walla.'); }
  }
  if (!ending && L.turns === Infinity && age() >= 60) {
    const p = Math.pow((age()-60)/35, 3) * 0.22 * (1.6 - S.health/100) * (W/3);
    if (chance(p) || age() >= 102) ending = `${S.name} passed peacefully at age ${age()}, with the whole town at the service.`;
  }
  if (!ending && S.turn >= L.turns) ending = `${L.label} in the Burg is in the books.`;
  if (!ending && S.money < -40000) ending = `Buried in debt, ${S.name} packed up and left Waitsburg.`;
  return { ev, notes, ending, review };
}

function deltaChips(before){
  const d = [['Happiness', S.happy-before.happy], ['Health', S.health-before.health], ['Community', S.community-before.community]];
  return d.map(([l,v]) => Math.abs(v) < 0.5 ? '' : `<span class="delta ${v>0?'up':'down'}">${l} ${v>0?'+':''}${Math.round(v)}</span>`).join('');
}

/* ---------- events ---------- */
function pickEvent(month){
  const wt = e => typeof e.w === 'function' ? e.w() : (e.w || 1);
  const ok = EVENTS.filter(e => !(S.evCd[e.title] > S.turn) && !(e.once && S.evDone[e.title]) && (!e.when || e.when(month)) && wt(e) > 0);
  const total = ok.reduce((a,e) => a + wt(e), 0);
  let r = Math.random() * total;
  for (const e of ok) { r -= wt(e); if (r <= 0) return e; }
  return null;
}
function showEvent(ev){
  const before = {happy:S.happy, health:S.health, community:S.community};
  const choices = ev.choices().filter(c => !c.if || c.if());
  const pin = S.evPins && S.evPins[0] && S.evPins[0].t === ev.title ? [S.evPins[0].m, S.evPins[0].k] : eventPlace(ev);
  sheet(`<div class="big">${ev.ic}</div><h2 style="text-align:center">${ev.title}</h2><p class="evplace">📍 ${esc(placeName(pin))}${pin[0] === 'R' ? ' · on the region map' : ''}</p><p>${typeof ev.text==='function'?ev.text():ev.text}</p>
    ${choices.map((c,i) => `<button class="btn ${i===0?'primary':'ghost'}" data-i="${i}">${c.label}</button>`).join('')}`);
  document.querySelectorAll('#sheet [data-i]').forEach(b => b.onclick = () => {
    const mBefore = S.money;
    const result = choices[+b.dataset.i].go() || '';
    const dm = S.money - mBefore;
    if (result) S.log.unshift({d: S.evLabel || dateLabel(), m: `${ev.title}: ${result}`});
    if (S.run) S.run.happened.push({ ic: ev.ic, title: ev.title, money: dm });
    if (S.evPins && S.evPins[0] && S.evPins[0].t === ev.title) S.evPins[0].r = result;
    save();
    if (choices.length === 1) { closeSheet(); render(); toast(`${ev.ic} ${result}${dm ? ` (${dm>0?'+':''}${fmt(dm)})` : ''}`); return; }
    sheet(`<div class="big">${ev.ic}</div><p>${result}</p>
      <p>${dm ? `<span class="delta ${dm>0?'up':'down'}">${dm>0?'+':''}${fmt(dm)}</span>` : ''}${deltaChips(before)}</p>
      <button class="btn primary" id="ok">Continue</button>`);
    $('#ok').onclick = () => { closeSheet(); render(); };
  });
}

  'The trip of a lifetime':['R','pasco'], 'A kid heads off to college':['T','school'], 'Friday night game':['T','school'], 'Toothache':['R','wallawalla']
};
const WORK_SPOT = { farmhand:'fields', diner:'mainst', para:'school', elevator:'elevator', insure:'mainst' };
function eventPlace(ev){
  let pl = EVENT_PLACE[ev.title] || ['T','mainst'];
  const j = S.retired ? null : job();
  if (pl === 'work') pl = !j ? ['T','mainst'] : j.city === 'waitsburg' ? ['T', WORK_SPOT[j.id]] : ['R', j.city];
  if (pl[1] === 'hwy' && !(j && j.city !== 'waitsburg')) pl = ['T','home'];   // the highway pin only shows for commuters
  return pl;
}
function placeName([m, k]){
  if (m === 'R') return CITIES[k] ? CITIES[k].name : (LANDMARKS.find(l => l.k === k) || {}).name || k;
  const tp = townPlaces().find(p => p.k === k);
  return tp ? (tp.k === 'home' ? 'Home' : tp.name) + (tp.k === 'hwy' ? '' : ', Waitsburg') : 'Waitsburg';
}
// events from the last 4 weeks at a place on a map
const recentAt = (m, k) => (S.evPins || []).filter(p => p.m === m && p.k === k && S.turn - p.turn <= 4);
function evBadge(m, k, x, y){
  const r = recentAt(m, k); if (!r.length) return '';
  const fresh = S.turn - r[0].turn <= 1;
  return `<g class="evbadge${fresh ? ' fresh' : ''}" pointer-events="none"><circle cx="${x}" cy="${y}" r="10" fill="#ffd166" stroke="#9b2f1f" stroke-width="1.5"/><text x="${x}" y="${y + 4}" font-size="11" text-anchor="middle">${r[0].ic}</text></g>`;
}
function recentList(m, k){
  const r = recentAt(m, k); if (!r.length) return '';
  return `<div class="recent"><b>📍 Recently here</b>${r.map(p => `<div class="s">${p.ic} ${esc(p.t)} · ${S.turn - p.turn <= 1 ? 'this week' : (S.turn - p.turn) + ' weeks ago'}${p.r ? `: ${esc(p.r)}` : ''}</div>`).join('')}</div>`;
}

function stopBlocked(s){
  if (s.min21 && age() < 21) return '21 and over';
  if (s.when && !s.when()) return `Only ${s.season}`;
  if (s.ok && !s.ok()) return s.id === 'tires' ? 'Already on this vehicle' : 'Not now';
  return '';
}
const townStops = city => STOPS.filter(s => s.towns.includes(city));

// a stop costs more with your partner along on a dinner or a movie
const stopCost = s => cost(s.cost) * (s.date && S.partner ? 2 : 1);
// breakdown odds: lower within 6 months of an oil change, higher after a year without one
function careMult(){ const w = S.turn - (S.svc ?? 0); return w <= 26 ? 0.6 : w <= 52 ? 1 : 1.4; }
const ditchMult = () => S.tires === S.car ? 0.4 : 1;
// plan this week's trip; returns '' or why it can't be planned
function planTrip(city, ids){
  if (!CITIES[city] || city === 'waitsburg') return 'Pick a town to visit.';
  ids = [...new Set(ids)];
  if (!ids.length) return 'Pick at least one stop.';
  if (ids.length > TRIP_MAX) return `Up to ${TRIP_MAX} stops a trip.`;
  for (const id of ids) {
    const s = stopById(id);
    if (!s || !s.towns.includes(city)) return 'That stop isn\'t in this town.';
    const why = stopBlocked(s); if (why) return `${s.name}: ${why.toLowerCase()}.`;
  }
  S.trip = { city, stops: ids };
  return '';
}
// runs inside weekTick's money step: adds the trip's lines, does its errands and returns the stat effects
function tripWeek(lines){
  const t = S.trip; if (!t || !CITIES[t.city]) { S.trip = null; return null; }
  const c = CITIES[t.city], fx = { happy:0, health:0, community:0 }, done = [];
  const gas = tripGas(t.city);
  if (gas) lines.push([`Trip to ${c.name}: gas`, -gas]);
  for (const id of t.stops) {
    const s = stopById(id); if (!s || stopBlocked(s)) continue;
    if (s.cost) lines.push([s.name, -stopCost(s)]);
    const half = S.turn - ((S.stopLast || {})[id] ?? -99) < REPEAT_WEEKS ? 0.5 : 1;   // again so soon: less special
    let mult = half;
    if (s.date && S.partner) mult += 0.4;
    if (s.id === 'wash' && [7,8,11,0,1].includes(curMonth())) mult += 0.5;
    if (s.id === 'checkup' && S.health < 50) mult *= 1.7;
    for (const [k, v] of Object.entries(s.fx || {})) fx[k] += v * mult * TRIP_FX;   // same scale as a week's focus
    if (s.id === 'stock') S.stockUntil = S.turn + STOCK_WEEKS;
    if (s.id === 'oil') S.svc = S.turn;
    if (s.id === 'tires') S.tires = S.car;
    if (s.id === 'dentist') S.dentist = S.turn;
    (S.stopLast = S.stopLast || {})[id] = S.turn;
    done.push(s.name.charAt(0).toLowerCase() + s.name.slice(1));
  }
  S.trip = null;
  if (!done.length) return null;
  log(`Trip to ${c.name}${tripIsCommute(t.city) ? ' on the way home from work' : ''}: ${done.join(', ')}.`);
  if (S.run) S.run.happened.push({ ic:'🚗', title:`Trip to ${c.name}`, money:0 });
  return { fx, away: !tripIsCommute(t.city) };
}

// Life Score: average happiness 30%, average health 20%, community 20%, net worth vs. the length's target 30%
function lifeScore(){
  const L = LENGTHS[S.len];
  const mp = Math.max(1, S.monthsPlayed);
  const avgH = S.happySum ? S.happySum/mp : S.happy, avgHe = S.healthSum ? S.healthSum/mp : S.health;
  // each part maps to 0–100 so that a middling life lands in the middle: happiness 30→0 and 90→100,
  // health 40→0 and 95→100, community 10→0 and 90→100, and net worth (in 2027 dollars) against the length's target
  const nw = netWorth(), real = nw / (S.col || 1), wealth = clamp(real / L.target * 100);
  const hp = clamp((avgH - 30) / 60 * 100), he = clamp((avgHe - 40) / 55 * 100), cm = clamp((S.community - 10) / 80 * 100);
  const score = Math.round(hp*0.3 + he*0.2 + cm*0.2 + wealth*0.3);
  const title = score >= 85 ? 'Legend of the Burg' : score >= 70 ? 'Pillar of the Community' : score >= 55 ? 'Solid Waitsburger' : score >= 40 ? 'Getting By on Main Street' : 'Tumbleweed';
  return { score, title, avgH, avgHe, nw, real, wealth, parts: { happy: Math.round(hp), health: Math.round(he), community: Math.round(cm), wealth: Math.round(wealth) } };
}

function spread(pts, min, w, h){
  const ks = Object.keys(pts), home = {}; ks.forEach(k => home[k] = pts[k].slice());
  for (let it = 0; it < 200; it++) {
    for (let i = 0; i < ks.length; i++) for (let j = i+1; j < ks.length; j++) {
      const a = pts[ks[i]], b = pts[ks[j]]; let dx = b[0]-a[0], dy = b[1]-a[1], d = Math.hypot(dx, dy);
      if (d >= min) continue; if (d < 0.01) { dx = 1; dy = 1; d = 1.4; }
      const p = (min - d) / 2, ux = dx/d, uy = dy/d; a[0] -= ux*p; a[1] -= uy*p; b[0] += ux*p; b[1] += uy*p;
    }
    ks.forEach(k => { const p = pts[k]; p[0] += (home[k][0]-p[0])*0.02; p[1] += (home[k][1]-p[1])*0.02;

  { const [x,y] = rxy(46.14,-118.60); s += `<g transform="translate(${x.toFixed(0)} ${(y-10).toFixed(0)})"><rect x="-13" y="-8" width="26" height="14" rx="3" fill="#fff" stroke="#9b2f1f"/><text y="3" text-anchor="middle" font-size="9" font-weight="800" fill="#9b2f1f">12</text></g>`; }
  s += `<text x="8" y="14" class="mlbl" font-weight="700">N ↑</text><text x="${RW-6}" y="${RH-5}" class="mlbl" text-anchor="end" font-size="7.5">Big rivers: Natural Earth · small rivers and roads approximate</text>`;

    MAPANIM = S.turn;
  }
  // pins
  for (const k of Object.keys(TOWNLL)) {

    s += `<g class="mpin" tabindex="0" role="button" aria-label="${c.name}" onclick="MAPTAP('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.dispatchEvent(new MouseEvent('click',{bubbles:true}))}">
      <circle cx="${x}" cy="${y}" r="35" fill="transparent"/><circle cx="${x}" cy="${y}" r="${sel?16:14}" fill="#fff" stroke="${sel?'#9b2f1f':isWork?'#5f8a55':'#3d2b1f'}" stroke-width="${sel||isWork?3:1.6}"/>
      <text x="${x}" y="${y+5}" font-size="14" text-anchor="middle">${TOWNIC[k]}</text>
      <text x="${x}" y="${y+28}" class="mtown" text-anchor="middle">${c.name}</text></g>`;
    if (k === 'waitsburg') s += `<text x="${x-17}" y="${y-11}" font-size="11" pointer-events="none">🏠</text>`;
    if (isWork) s += `<text x="${x+11}" y="${y-11}" font-size="11" pointer-events="none">💼</text>`;
    s += evBadge('R', k, x + 15, y + 12);
  }
  for (const l of LANDMARKS) {
    const [x,y] = pins[l.k], sel = MAPSEL === l.k;
    s += `<g class="mpin" tabindex="0" role="button" aria-label="${l.name}" onclick="MAPTAP('${l.k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.dispatchEvent(new MouseEvent('click',{bubbles:true}))}"><circle cx="${x}" cy="${y}" r="35" fill="transparent"/><circle cx="${x}" cy="${y}" r="${sel?14:12}" fill="#fffaf0" stroke="${sel?'#9b2f1f':'#7a6a5c'}" stroke-width="${sel?3:1.2}" stroke-dasharray="${sel?'':'3 2'}"/><text x="${x}" y="${y+4.5}" font-size="12" text-anchor="middle">${l.ic}</text></g>` + evBadge('R', l.k, x + 13, y + 11);
  }
  return s + '</svg>';
}

      <p>Once a week you can take a <b>trip</b> to Dayton, Walla Walla or the Tri-Cities: tap <b>🚗 Plan a trip</b> on Home, or a town on the region map. Pick a town and up to ${TRIP_MAX} stops. The trip happens when you end the week.</p>
      <ul><li><b>Gas:</b> there and back, at your vehicle's mileage. In the town you <b>commute to</b> it's free: you stop on the way home.</li>
      <li><b>Time:</b> any other trip takes part of your week, so your focus works at ${TRIP_TIME*100}% that week.</li>
      <li><b>Groceries:</b> a stock-up run at a big store makes groceries ${STOCK_OFF*100}% cheaper for ${STOCK_WEEKS} weeks.</li>
      <li><b>Car care:</b> an oil change cuts breakdowns for 6 months; after a year without one they're more likely. Winter tires (October–January) make sliding off Highway 12 much less likely. Your vehicle's tabs renew every January (DMV).</li>
      <li><b>Appointments:</b> skip the dentist for more than a year and a toothache gets likely. A doctor checkup does more when your health is low.</li>
      <li><b>Going out:</b> doing the same thing again within ${REPEAT_WEEKS} weeks is only half as fun. Dinners and movies cost double, and do more, with your partner along.</li></ul>
      <table><tr><th>Town</th><th>Places to go</th></tr>${Object.entries(CITIES).filter(([k]) => k !== 'waitsburg').map(([k,c]) => `<tr><td>${TOWNIC[k]} <b>${c.name}</b><br><small>${c.miles} mi</small></td><td>${townStops(k).map(x => `${x.ic} ${x.name}${x.cost ? ` ($${x.cost})` : ''}${x.season ? ` <small>(${x.season})</small>` : ''}${x.min21 ? ' <small>(21+)</small>' : ''}`).join('<br>')}</td></tr>`).join('')}</table>
      <p class="muted">Prices are in 2027 dollars and rise over the years. Places are described, not named.</p>`],
    ['saves', '💾 Saving and loading', `
      <p>You can keep up to <b>5 lives</b>. Each one saves itself after every week.</p>
      <ul><li><b>Title screen:</b> your lives are listed with Continue and 🗑 Delete. When all 5 slots are full, a new life asks which one to replace.</li>
      <li><b>Menu → 💾 Save game:</b> Save writes your current life right now. Save here or Replace on another slot makes a copy as a checkpoint you can go back to.</li>
      <li><b>Menu → 📂 Load game:</b> switches to any saved life. The one you're playing is saved first.</li></ul>
      <p>Finishing a life frees its slot. Saves live on this device and in this browser.</p>
      <p><b>Menu → 📤 Back up or restore:</b> download a backup file or copy a backup code, then on another device use <b>📥 Restore from a backup</b> (on the title screen or in the same menu). You can add the backup's lives to empty slots or replace all your lives.</p>`],
    ['score', '🏆 The Life Score', `
      <p>At the end, your life gets a score out of 100 from four parts:</p>
      <table><tr><th>Part</th><th>Measured as</th><th>Weight</th></tr>
      <tr><td>Happiness</td><td>Your average over the game: 30 → 0 points, 90 → 100</td><td>30%</td></tr>
      <tr><td>Health</td><td>Your average: 40 → 0, 95 → 100</td><td>20%</td></tr>
      <tr><td>Community</td><td>Where you end: 10 → 0, 90 → 100</td><td>20%</td></tr>
      <tr><td>Net worth</td><td>Against the target for your game length (in 2027 dollars)</td><td>30%</td></tr></table>
      <p>Titles: 85+ <b>Legend of the Burg</b>, 70+ <b>Pillar of the Community</b>, 55+ <b>Solid Waitsburger</b>, 40+ <b>Getting By on Main Street</b>, below that <b>Tumbleweed</b>. Your best score for each length is kept.</p>`],
    ['tips', '💡 Tips', `
      <ul><li>Rotate your focus: a little work, a little town, a little rest. Long streaks fade and ruts hurt.</li>
      <li>Classes are a long game. A certificate or degree opens jobs that pay far more.</li>
      <li>Compare <b>take-home</b>, not pay: a long commute in a thirsty pickup eats a raise fast.</li>
      <li>Save 5% in your 401(k) for the free 3% match, especially in long games.</li>
      <li>Show up for town. Community counts for the score, helps you get hired, and unlocks the council.</li>
      <li>Watch the week strip. If a stat keeps going ▼, change your focus before it turns red.</li>
      <li>Before a risky choice, save a copy (Menu → 💾 Save game) so you can come back.</li></ul>`],
    ['install', '📱 Installing and playing offline', `
      <p>The Burg is a web app you can install. On iPhone, open it in Safari, tap Share, then <b>Add to Home Screen</b>. On Android, open it in Chrome and tap <b>Install app</b> (or ⋮ → Add to Home screen). After the first visit it works offline.</p>
      <p>There's also an <b>Android app (APK)</b> and a <b>Windows installer</b> on the game's GitHub releases page: github.com/krazow/The-Burg/releases.</p>
      <p>Version ${APP_VERSION}.</p>`]
  ];
  return `<div class="guide">
    <h2 class="gt">📖 Game guide</h2>
    <nav class="toc" aria-label="Guide contents">${S2.map(([id,t]) => `<button onclick="document.getElementById('g-${id}').scrollIntoView({behavior:'smooth'})">${t}</button>`).join('')}</nav>
    ${S2.map(([id,t,b]) => sec(id, t, b)).join('')}
  </div>`;
}
function showHelp(){
  closeSheet(); $('#toast').classList.add('hidden');
  HELP_FROM = S && !S.over ? 'game' : 'title';
  const v = $('#helpview');
  v.innerHTML = `<div class="helphead"><h1>❓ Help</h1><button class="sm alt" id="helpclose" aria-label="Close help">✕ Close</button></div>
    <div class="helpbody">
      <div class="card tutcard"><h3>🎮 Gameplay tutorial</h3>
        <p>Play a short <b>practice life</b>, about 3 minutes. A pulsing ring shows exactly what to tap, and each step waits for your tap. ${HELP_FROM === 'game' ? 'Your current life is saved first and comes right back afterward.' : 'Nothing is saved.'}</p>
        <button class="btn primary" id="tutstart">Start the tutorial</button></div>
      ${guideHTML()}
    </div>`;
  if (!lastHelpFocus) lastHelpFocus = document.activeElement && document.activeElement.id || null;
  v.classList.remove('hidden'); v.scrollTop = 0; setTimeout(() => $('#helpclose').focus({ preventScroll: true }), 30);
  $('#helpclose').onclick = closeHelp;
  $('#tutstart').onclick = startTutorial;
}
let lastHelpFocus = null;
function closeHelp(){
  const wasOpen = !$('#helpview').classList.contains('hidden');
  $('#helpview').classList.add('hidden');
  const id = lastHelpFocus; lastHelpFocus = null;
  if (wasOpen && !TUT) setTimeout(() => { const el = id && document.getElementById(id); if (el) el.focus({ preventScroll: true }); }, 30);
}

/* ---------- guided practice tutorial ---------- */
let TUT = null;
const TSTEPS = [
  { text:'👋 Welcome to a <b>practice life</b>. Nothing here is saved. Follow the <b>pulsing ring</b> and tap what it points to.' },
  { sel:'[data-apply="farmhand"]', tap:1, text:'This is the <b>Jobs</b> tab. Each job shows take-home pay after taxes and gas. Tap <b>Apply</b> on Wheat farm hand.' },
  { sel:'#modal:not(.hidden) #ok', tap:1, text:'You got the job! Tap <b>Let\'s go</b>.' },
  { sel:'#main .stats', text:'These are your <b>stats</b>: happiness, health and community (0–100), and net worth. Later, tap any stat to see what moves it.' },
  { sel:'[data-f="community"]', tap:1, text:'Each week you pick one <b>focus</b>. Tap <b>Town</b> to show up for your community.' },
  { sel:'#end', tap:1, text:'The End Week button shows your focus. Tap <b>End Week</b> to play the week.' },
  { sel:'#strip', tap:1, text:'This strip shows what the week did: money, and ▲▼ for each stat. Tap it.' },
  { sel:'#modal:not(.hidden) #ok', tap:1, text:'Here\'s every paycheck and bill. Tap <b>Close</b>.' },
  { before:() => showEvent(EVENTS.find(e => e.title === 'Celebration Days')), sel:'#modal:not(.hidden) [data-i="0"]', tap:1, text:'<b>Events</b> pop up as life happens. Tap the first choice.' },
  { sel:'#modal:not(.hidden) #ok', tap:1, text:'Every choice shows what it did. Tap <b>Continue</b>.' },
  { sel:'#ff4', tap:1, text:'<b>⏩</b> plays several weeks with the same focus and stops if something needs you. Tap <b>⏩ 4</b>.' },
  { sel:'nav [data-tab="jobs"]', tap:1, text:'Let\'s look for better work. Tap <b>Jobs</b>.' },
  { sel:'[data-locked="para"]', tap:1, text:'🔒 jobs need more schooling. Tap the locked <b>School paraeducator</b> job.' },
  { sel:'#modal:not(.hidden) #yes', tap:1, text:'It shows what the job takes. Tap <b>Make Take classes my focus</b>.' },
  { sel:'nav [data-tab="life"]', tap:1, text:'Tap <b>Life</b> for homes, rides, savings and family.' },
  { sel:'[data-k401="1"]', tap:1, text:'Save for retirement: tap <b>5%</b>. Your employer adds 3% on top.' },
  { sel:'nav [data-tab="home"]', tap:1, text:'Back to <b>Home</b>.' },
  { sel:'#main .maptog button:nth-child(2)', tap:1, text:'Rather use a map? Tap <b>🗺️ Map</b>.' },
  { sel:'.mpin[aria-label="Touchet River"]', tap:1, text:'Tap a place to spend your week there. Tap the <b>River</b>.' },
  { sel:'.mapdet .sm', tap:1, text:'Tap <b>Spend this week here</b>.' },
  { sel:'#main .maptog button:nth-child(1)', tap:1, text:'Your focus is now <b>Get outside</b>. Tap <b>📋 List</b> to switch back.' },
  { sel:'nav [data-tab="menu"]', tap:1, text:'Tap <b>Menu</b>.' },
  { sel:'#modal:not(.hidden) #save', text:'<b>💾 Save game</b> and <b>📂 Load game</b> live here. Real lives also save themselves every week, in up to 5 slots.' },
  { sel:'#modal:not(.hidden) #close', tap:1, text:'Tap <b>Close</b>.' },
  { sel:'#helpbtn', text:'Tap <b>?</b> any time for the full game guide, or to replay this tutorial.' },
  { text:'🎉 That\'s the basics! Balance <b>happiness, health, community and money</b>, and mix up your weekly focus. Good luck in the Burg.', done:1 }
];
function startTutorial(){
  closeHelp(); closeSheet();
  if (S && !S.over && !S.practice) save();
  TUT = { i: -1, prev: { S: S && !S.over ? clone(S) : null, tab, prefs: clone(prefs()), jobCity, jobOK } };
  setPref('mapView', false); jobCity = 'all'; jobOK = false;
  newGame('Practice', 'half', 0, { practice: true });
  if (!$('#coach')) document.body.insertAdjacentHTML('beforeend', '<div id="coach" class="hidden"></div>');
  tutNext();
}
function tutNext(){
  if (!TUT) return;
  TUT.i++;
  const st = TSTEPS[TUT.i];
  if (!st) return endTutorial(true);
  if (st.before) st.before();
  TUT.tries = 0;
  setTimeout(drawCoach, 380);                       // let sheets slide in and screens redraw
}
function drawCoach(){
  if (!TUT) return;
  const st = TSTEPS[TUT.i], c = $('#coach');
  $('#toast').classList.add('hidden');
  const el = st.sel ? document.querySelector(st.sel) : null;
  if (st.sel && !el) { if (++TUT.tries < 12) return setTimeout(drawCoach, 150); return tutNext(); }   // skip a step whose target never appeared
  if (el && el.scrollIntoView && !el.closest('.endbar, .weekstrip, nav, .sheet')) el.scrollIntoView({ block: 'center' });
  const r = el ? el.getBoundingClientRect() : null, pad = 6;
  const box = r ? { x: r.left - pad, y: r.top - pad, w: r.width + pad*2, h: r.height + pad*2 } : null;
  const vw = innerWidth, vh = innerHeight;
  const dim = box ? [
      [0, 0, vw, Math.max(0, box.y)], [0, box.y + box.h, vw, Math.max(0, vh - box.y - box.h)],
      [0, box.y, Math.max(0, box.x), box.h], [box.x + box.w, box.y, Math.max(0, vw - box.x - box.w), box.h]]
    : [[0, 0, vw, vh]];
  const below = box && box.y + box.h / 2 < vh / 2;
  const bubbleY = !box ? 'top:50%;transform:translate(-50%,-50%)' : below ? `top:${Math.min(vh - 200, box.y + box.h + 14)}px` : `bottom:${Math.min(vh - 120, vh - box.y + 14)}px`;
  c.innerHTML = dim.map(([x,y,w,h]) => `<div class="cdim" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`).join('') +
    (box ? `<div class="cring${st.tap ? ' tap' : ''}" style="left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px"></div>${st.tap ? `<div class="cfinger" style="left:${box.x + box.w/2}px;top:${box.y + box.h/2}px">👆</div>` : ''}` : '') +
    `<div class="cbubble" role="dialog" aria-live="polite" style="${bubbleY}">
      <div class="cstep">Step ${TUT.i + 1} of ${TSTEPS.length}</div>
      <div class="ctext">${st.text}</div>
      <div class="cbtns">${st.tap ? '<span class="chint">👆 Tap the highlighted spot</span>' : `<button class="sm" id="cnext">${st.done ? 'Finish' : 'Next'}</button>`}
        ${st.done ? '' : '<button class="sm alt" id="cskip">Skip tutorial</button>'}</div></div>`;
  c.classList.remove('hidden');
  announce(`Tutorial step ${TUT.i + 1} of ${TSTEPS.length}. ${c.querySelector('.ctext').textContent}`);
  { const f = st.tap && el && el.focus ? el : $('#cnext'); if (f) f.focus({ preventScroll: true }); }   // keyboard users can press Enter
  if ($('#cnext')) $('#cnext').onclick = e => { e.stopPropagation(); hideCoach(); tutNext(); };
  if ($('#cskip')) $('#cskip').onclick = e => { e.stopPropagation(); endTutorial(false); };
}
function hideCoach(){ const c = $('#coach'); if (c) { c.classList.add('hidden'); c.innerHTML = ''; } }
// a tap on the highlighted spot moves the tutorial on (the app handles the tap as usual)
document.addEventListener('click', e => {
  if (!TUT) return;
  const st = TSTEPS[TUT.i];
  if (st && st.tap && st.sel && e.target.closest && e.target.closest(st.sel)) { hideCoach(); setTimeout(tutNext, 60); }
}, true);
addEventListener('resize', () => { if (TUT && !$('#coach').classList.contains('hidden')) drawCoach(); });
function endTutorial(done){
  const prev = TUT && TUT.prev; TUT = null; hideCoach(); closeSheet();
  if (!prev) return;
  store.set(PREF_KEY, prev.prefs); jobCity = prev.jobCity; jobOK = prev.jobOK;
  S = prev.S; tab = prev.tab || 'home';
  if (S) { render(); window.scrollTo(0,0); } else renderTitle();
  toast(done ? '🎉 Tutorial finished' : 'Tutorial closed');
}

/* ---------- boot ---------- */
renderTitle();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){} });
}
</script>
