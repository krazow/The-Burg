<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9b2f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Burg">
<title>The Burg</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --barn:#9b2f1f; --barn-d:#6f1f14; --wheat:#e9c46a; --wheat-d:#c99a3b;
  --cream:#fbf6ea; --paper:#fffdf7; --soil:#3d2b1f; --muted:#6b5b4e;
  --sage:#4a7340; --sky:#7fb3d5; --line:#e7dcc4;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--soil);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Title screen */
.title{padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);text-align:center}
.scene{width:100%;max-width:420px;margin:0 auto;display:block}
.title h1{font-size:46px;letter-spacing:1px;color:var(--barn);margin-top:6px}
.title .sub{color:var(--muted);margin:4px 0 20px}
.field{display:block;text-align:left;margin:14px 0 6px;font-weight:600;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input[type=text]{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--paper)}
input[type=text]:focus{outline:none;border-color:var(--wheat-d)}
.lengths{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.len{padding:14px 6px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.len b{display:block;font-size:17px}.len span{font-size:12px;color:var(--muted)}
.len.on{border-color:var(--barn);background:#fbe9e4}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:17px;margin-top:12px}
.btn.primary{background:var(--barn);color:#fff;box-shadow:0 3px 0 var(--barn-d)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--barn-d)}
.btn.ghost{border:2px solid var(--line);background:var(--paper)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.bigstart{padding:18px;font-size:19px;margin-top:16px}
.moreopts{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:12px;padding:10px 14px;border:2px dashed var(--line);border-radius:14px;background:var(--paper);text-align:left;min-height:48px}
.moreopts .s{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}.moreopts .caret{font-size:18px;color:var(--muted)}
.morepanel{border:1.5px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:0 10px 10px;margin-top:-6px;background:#fffaf0}
.rec{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0;background:#fff;border-radius:10px;overflow:hidden}
.rec caption{text-align:left;font-size:13px;color:var(--muted);padding:2px 0 6px}
.rec th,.rec td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}.rec th[scope=row],.rec thead th:first-child{text-align:left}
.rec thead th{font-size:12px;color:var(--muted);font-weight:700}
.wnlist{padding-left:4px;list-style:none;margin:8px 0}.wnlist li{margin:8px 0;line-height:1.4;font-size:15px}

/* Game header */
.top{background:var(--barn);color:#fff;padding:calc(var(--safe-t) + 12px) 16px 12px;position:sticky;top:0;z-index:5}
.top .row{display:flex;justify-content:space-between;align-items:baseline}
.top h2{font-size:20px}
.top .money{font-weight:800;font-size:20px}
.top .meta{font-size:13px;opacity:.85;margin-top:2px;display:flex;justify-content:space-between}
.progress{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--wheat)}
main{flex:1;padding:14px 14px calc(var(--safe-b) + 200px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stat label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between}
.bar{height:10px;background:#efe6d2;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn{text-align:left;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:74px}
.fbtn .ic{font-size:22px}.fbtn b{display:block;font-size:14px;margin-top:2px}.fbtn small{color:var(--muted);font-size:12px;line-height:1.25;display:block}
.fbtn.on{border-color:var(--barn);background:#fbe9e4}
.fbtn[disabled]{opacity:.4}
.endbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 66px);width:min(492px,calc(100% - 28px));z-index:6;display:flex;gap:8px}
.endbar .btn{margin-top:0;padding:10px 6px;font-size:16px;min-height:56px}.endbar #end{flex:2.2;line-height:1.15}.endbar #end small{display:block;font-size:12.5px;font-weight:600;opacity:.9;margin-top:2px}
.endbar .ghost{flex:1;font-size:14px;padding:10px 2px}
.weekstrip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 130px);width:min(492px,calc(100% - 28px));z-index:6;
  display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:7px 10px;box-shadow:0 2px 10px rgba(61,43,31,.12);text-align:left}
.weekstrip .wl{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}.weekstrip .wc{flex:1;display:flex;flex-wrap:wrap;gap:2px}
.weekstrip .delta{margin:0;font-size:12.5px;padding:2px 6px}.weekstrip .more{font-size:22px;color:var(--muted);line-height:1}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fgrid .fbtn{min-height:64px;text-align:center;padding:8px 4px}.fgrid .fbtn b{font-size:13.5px}
.fdesc{font-size:14px;margin-top:10px;line-height:1.35}.fdesc .s{font-size:13px;color:var(--barn-d);margin-top:4px}
.statbtn{text-align:left;padding:4px 2px;border-radius:10px;width:100%}.statbtn:active{background:#f3ead6}.statbtn label{cursor:pointer}
.info{font-size:11px;color:var(--muted)}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.sumchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13.5px;min-height:40px}
.tip{display:flex;gap:10px;align-items:center;background:#eef5e9;border-color:#cfe2c3;font-size:14px}
.warn .sm{margin-left:6px;margin-top:6px}
.sm.locked{background:#fff;color:var(--muted);border:1.5px dashed #cdbfa5}.lockedrow .t{color:var(--muted)}
.job > div:last-child .s{white-space:nowrap}.upt{color:#3d6b33;font-weight:700}.downt{color:var(--barn);font-weight:700}.chip.ok.on{background:var(--sage);border-color:var(--sage)}
.warn{background:#fbe9e4;border-color:#efc2b8;color:var(--barn-d);font-size:14px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.chip.on{background:var(--soil);color:#fff;border-color:var(--soil)}
.job{display:flex;justify-content:space-between;gap:10px;align-items:center}
.job .t{font-weight:700}.job .s{font-size:13px;color:var(--muted)}
.job .pay{font-weight:800;color:var(--sage);white-space:nowrap}
.sm{padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--barn);color:#fff;white-space:nowrap}
.sm.alt{background:#fff;border:1.5px solid var(--line);color:var(--soil)}
.sm[disabled]{background:#d8cfbf;color:#fff;pointer-events:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:#efe6d2;color:var(--muted);margin-left:4px;vertical-align:middle}
.tag.cur{background:var(--sage);color:#fff}
.logitem{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.logitem em{font-style:normal;color:var(--muted);font-size:12px;display:block}
.muted{color:var(--muted);font-size:14px}

/* Tabs */
#app > nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:7}
#app > nav .in{display:flex;width:100%;max-width:520px}
#app > nav button{flex:1;padding:8px 0 10px;font-size:12px;color:var(--muted);font-weight:600}
#app > nav button .ic{display:block;font-size:20px}
#app > nav button.on{color:var(--barn)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(var(--safe-b) + 20px);max-height:88vh;overflow:auto;animation:up .25s}
.sheet h2{font-size:23px;color:var(--barn);margin-bottom:6px}
.sheet .big{font-size:44px;text-align:center}
.sheet p{margin:8px 0}
.delta{display:inline-block;margin:3px 4px 0 0;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:700}
.delta.up{background:#e3f0dc;color:#3d6b33}.delta.flat{background:#efe6d2;color:var(--muted)}.delta.down{background:#f7dfda;color:#9b2f1f}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 196px);transform:translateX(-50%);background:var(--soil);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.maptog{display:flex;gap:6px;margin:2px 0 10px}.maptog button{flex:1;border:1.5px solid var(--barn);background:#fff;color:var(--barn);border-radius:999px;padding:7px 10px;font-size:14px;font-weight:700}
.maptog button.on{background:var(--barn);color:#fff}
.maptabs{display:flex;gap:6px;margin-bottom:6px}.maptabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.maptabs button.on{border-color:var(--soil);color:var(--soil);background:#f6efdf}
.mapsvg{display:block;width:100%;height:auto;border-radius:12px;border:1.5px solid var(--line);touch-action:manipulation}
.mapsvg .mlbl{font-size:9px;fill:#6b5a49;font-style:italic}.mapsvg .mwlbl text{font-size:9px;fill:#3f7491;font-style:italic}
.mapsvg .mtown{font-size:9.5px;font-weight:800;fill:#3d2b1f;paint-order:stroke;stroke:#fffaf0;stroke-width:3px;pointer-events:none}
.mpin{cursor:pointer;outline:none}.mpin:focus-visible circle{stroke:var(--barn);stroke-width:3}
.mapcap{font-size:13px;color:var(--muted);margin:6px 2px 8px}.mapdet{margin:4px 0 0;background:#fffaf0}
.slots{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px;text-align:left}
.slot{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.slot.empty{border-style:dashed}.slot.empty .slotinfo{opacity:.7}.slot .s{font-size:12.5px;color:var(--muted)}.slotinfo{min-width:0}
.slotbtns{display:flex;gap:6px;flex-shrink:0}
.hdr-r{display:flex;align-items:center}
#helpbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.85);color:#fff;font-size:19px;font-weight:800;line-height:1;margin-left:10px;flex-shrink:0}
.helpview{position:fixed;inset:0;background:var(--cream);z-index:25;overflow:auto;-webkit-overflow-scrolling:touch}
.helphead{position:sticky;top:0;background:var(--barn);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 12px) 16px 12px;z-index:2}
.helphead h1{font-size:22px}
.helpbody{max-width:520px;margin:0 auto;padding:14px 14px calc(var(--safe-b) + 30px)}
.tutcard{background:#eef5e9;border-color:#cfe2c3}.tutcard p{margin:6px 0 0;font-size:15px}
.guide h2{font-size:20px;color:var(--barn);margin:24px 0 8px}.guide .gt{margin-top:8px}
.guide section{scroll-margin-top:70px}.guide p{margin:8px 0;line-height:1.45}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toc button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;min-height:44px}
.guide table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;background:var(--paper);border-radius:10px;overflow:hidden}
.guide th,.guide td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.guide th{font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px}
.guide tr.grp td{background:#f6efdf}.guide ul{padding-left:20px}.guide li{margin:6px 0;line-height:1.4}
.totop{font-size:13px;color:var(--muted);padding:8px 0;min-height:36px}
#coach{position:fixed;inset:0;z-index:45;pointer-events:none}
.cdim{position:fixed;background:rgba(30,18,10,.62);pointer-events:auto;touch-action:none}
.cring{position:fixed;border:3px solid #ffd166;border-radius:14px;pointer-events:none}
.cring.tap{animation:cpulse 1.2s infinite}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.85)}100%{box-shadow:0 0 0 18px rgba(255,209,102,0)}}
.cfinger{position:fixed;font-size:30px;pointer-events:none;animation:ctap 1.2s infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@keyframes ctap{0%,100%{transform:translate(-20%,20%)}50%{transform:translate(-20%,0) scale(.88)}}
.cbubble{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));background:var(--paper);border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:auto;font-size:15px}
.cstep{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.ctext{margin:6px 0 12px;line-height:1.4}.cbtns{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chint{font-size:13.5px;color:var(--barn);font-weight:700}
@media (prefers-reduced-motion: reduce){.cring.tap,.cfinger{animation:none}}
.sm,.chip,.maptog button,.maptabs button,.sumchip,.totop,.weekstrip,.statbtn,.toc button{min-height:44px}
.sm,.chip{min-width:44px}.slotbtns .sm{min-width:48px}
.triph{margin:12px 0 4px;font-size:15px}
.stopbtn{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;min-height:48px}
.stopbtn .t{display:block;font-weight:700;font-size:15px}.stopbtn .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.stopbtn.on{border-color:var(--barn);background:#fbe9e4}.stopbtn:disabled{opacity:.6}
.tripsum{font-weight:700;margin:10px 0 0}
.sumchip.on{border-color:var(--barn);background:#fbe9e4}
.bgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.bgdesc{font-size:13.5px;margin:6px 4px 0;min-height:36px}
.sgoal{font-size:13.5px;background:#fffaf0;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.scorebtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fffaf0;font-size:14.5px;min-height:44px;text-align:left}.scorebtn b{font-size:17px;color:var(--barn)}
.tripto{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px dashed var(--line);min-height:52px;font:inherit;color:inherit;cursor:pointer}.tripto > span:first-child{display:flex;flex-direction:column}
#helpbtn{width:44px;height:44px}
:focus-visible{outline:3px solid #1f5fae;outline-offset:2px}
.top :focus-visible,.helphead :focus-visible{outline-color:#fff}
#app > nav button:focus-visible{outline-offset:-4px}
.mpin:focus-visible{outline:none}.mpin:focus-visible circle:nth-of-type(2){stroke:#1f5fae;stroke-width:4}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (orientation: landscape) and (max-height: 520px){
  .top{padding:calc(var(--safe-t) + 4px) 16px 4px}.top h2{font-size:16px}.top .money{font-size:17px}
  .top .meta{font-size:12px;margin-top:0}.top .progress{margin-top:3px}
  #app > nav button{padding:2px 0;font-size:11.5px;min-height:44px}#app > nav button .ic{display:inline;font-size:16px;margin-right:4px}
  .endbar{left:auto;right:14px;transform:none;width:calc(58% - 21px);bottom:calc(var(--safe-b) + 50px)}
  .endbar .btn{min-height:50px;padding:4px}
  .weekstrip{left:14px;transform:none;width:calc(42% - 21px);bottom:calc(var(--safe-b) + 50px);min-height:50px}
  main{padding-bottom:calc(var(--safe-b) + 116px)}
  .toast{bottom:calc(var(--safe-b) + 112px)}
}
.evplace{text-align:center;color:var(--muted);font-size:14px;margin:0 0 6px}
.recent{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}.recent .s{margin-top:4px}
.evbadge.fresh circle{animation:evpulse 1.6s ease-in-out 3}
@keyframes evpulse{50%{stroke-width:5;stroke:#ffd166}}
@media (prefers-reduced-motion: reduce){.evbadge.fresh circle{animation:none}}
.code{width:100%;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--soil);word-break:break-all;resize:vertical}
.warnline{color:var(--barn-d);font-weight:600}
.outbtn{margin-top:10px;padding:10px 12px}.outbtn small{display:block;font-size:13px;font-weight:600;margin-top:2px}
.score{font-size:64px;font-weight:800;text-align:center;color:var(--barn);font-family:Georgia,serif}
/* i2 clarity: focus preview, why lines, celebrations, checklist, next step, glossary, confirmations, life story */
.preview{font-size:13.5px;margin-top:8px;padding:8px 10px;background:#fffaf0;border:1px solid var(--line);border-radius:10px;color:var(--soil);line-height:1.4}
.preview .s,.fdesc .preview .s{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fbtn small.fade{color:var(--barn-d);font-weight:700;font-size:12px;display:block}
.kv.whyrow{width:100%;text-align:left;align-items:center;min-height:44px;font-size:15px}
.whytext{font-size:13.5px;color:var(--soil);background:#fffaf0;border-left:3px solid var(--wheat-d);padding:6px 8px;margin:2px 0 6px}
.celebrate{display:flex;justify-content:center;gap:10px;height:0;overflow:visible}
.celebrate i{display:block;width:8px;height:12px;border-radius:2px;background:var(--wheat-d);animation:pop 1.4s ease-out both}
.celebrate i:nth-child(3n){background:var(--barn)}.celebrate i:nth-child(3n+1){background:var(--sage)}
.celebrate i:nth-child(2n){animation-delay:.15s}.celebrate i:nth-child(4n){animation-delay:.3s}
@keyframes pop{0%{transform:translateY(40px) scale(0);opacity:0}30%{opacity:1}100%{transform:translateY(-10px) rotate(260deg);opacity:0}}
.checklist ul.cl{list-style:none;padding:0;margin:4px 0 8px}
.checklist ul.cl li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;min-height:44px;border-bottom:1px dashed var(--line);font-size:14px}
.checklist ul.cl li.done{color:var(--muted)}
.card.next{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#eef3fa;border-color:#cfdced;font-size:14px}
