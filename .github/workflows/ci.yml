# Runs the shared Krazow release kit's QA (tests + release checks) on every pull request and push to main.
# Simulation scale (T2): the QA job runs `npm test`, and tests/sim.test.mjs plays the simulation at half scale
# (SIM_SCALE=0.5) when GITHUB_EVENT_NAME is pull_request, and at full scale on pushes to main and in releases.
# (A reusable workflow doesn't inherit this file's env, so the switch lives in the test itself.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: krazow/release-kit/.github/workflows/qa.yml@v1
